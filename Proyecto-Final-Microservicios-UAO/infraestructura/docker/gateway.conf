server {
 listen 80;
 root /usr/share/nginx/html;
 resolver 127.0.0.11 valid=10s ipv6=off;
 location /api/v1/facultades { set $upstream catalogo:8000; proxy_pass http://$upstream$request_uri; }
 location /api/v1/salas { set $upstream catalogo:8000; proxy_pass http://$upstream$request_uri; }
 location /api/v1/usuarios { set $upstream usuarios:8000; proxy_pass http://$upstream$request_uri; }
 location /api/v1/reservas { set $upstream reservas:8000; proxy_pass http://$upstream$request_uri; }
 location /api/v1/auditoria { set $upstream auditoria:8000; proxy_pass http://$upstream$request_uri; }
 location /api/v1/reportes { set $upstream analitica:8000; proxy_pass http://$upstream$request_uri; }
 location / { try_files $uri $uri/ /index.html; }
}
